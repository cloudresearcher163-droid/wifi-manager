name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Locate Project and Build APK
      run: |
        # Find where settings.gradle or build.gradle is hidden in the repo
        PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -maxdepth 3 | xargs dirname | head -n 1)
        
        if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
          # If no gradle project exists yet, look for any folder with code or use root
          PROJECT_DIR="."
        fi
        
        echo "Found project directory at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # Setup modern gradle wrapper if missing
        if [ ! -f "./gradlew" ]; then
          gradle wrapper --gradle-version 8.5
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
        if-no-files-found: error
        
