name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Project and Build APK
      run: |
        if [ ! -f "settings.gradle" ]; then
          mkdir -p app/src/main/java/com/wifi/shortcut
          echo "include ':app'" > settings.gradle
          printf "plugins {\n    id 'com.android.application' version '8.2.0' apply false\n    id 'org.jetbrains.kotlin.android' version '1.9.20' apply false\n}\n" > build.gradle
          printf "plugins {\n    id 'com.android.application'\n    id 'org.jetbrains.kotlin.android'\n}\nandroid {\n    namespace 'com.wifi.shortcut'\n    compileSdk 34\n    defaultConfig {\n        applicationId 'com.wifi.shortcut'\n        minSdk 26\n        targetSdk 34\n        versionCode 1\n        versionName \"1.0\"\n    }\n}\ndependencies {\n    implementation 'androidx.core:core-ktx:1.12.0'\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n}\n" > app/build.gradle
          printf "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <application android:label=\"Wi-Fi Shortcut\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n" > app/src/main/AndroidManifest.xml
          printf "package com.wifi.shortcut\nimport android.content.Intent\nimport android.os.Build\nimport android.os.Bundle\nimport android.provider.Settings\nimport androidx.appcompat.app.AppCompatActivity\n\nclass MainActivity : AppCompatActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        val intent = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {\n            Intent(Settings.Panel.ACTION_INTERNET_CONNECTIVITY)\n        } else {\n            Intent(Settings.ACTION_WIFI_SETTINGS)\n        }\n        startActivity(intent)\n        finish()\n    }\n}\n" > app/src/main/java/com/wifi/shortcut/MainActivity.kt
        fi
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
