name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Project and Build APK
      run: |
        # If no Android project files exist, generate a minimal working structure automatically
        if [ ! -f "settings.gradle" ]; then
          echo "Generating minimal Android project structure..."
          mkdir -p app/src/main/java/com/wifi/shortcut

          echo "include ':app'" > settings.gradle

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.wifi.shortcut'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.wifi.shortcut'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Wi-Fi Shortcut">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/wifi/shortcut/MainActivity.kt
          package com.wifi.shortcut
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val intent = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      Intent(Settings.Panel.ACTION_INTERNET_CONNECTIVITY)
                  } else {
                      Intent(Settings.ACTION_WIFI_SETTINGS)
                  }
                  startActivity(intent)
                  finish()
              }
          }
          EOF
        fi

        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
