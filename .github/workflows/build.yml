name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Debug APK with Native SDK
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        chmod +x gradlew
        ./gradlew assembleDebug
        
